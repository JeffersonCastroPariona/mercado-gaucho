steps:
  # Paso 1: Usar una imagen de Node.js 20 (compatible con Vite)
  - name: 'node:20'  # Usamos la imagen oficial de Node.js 20
    args: ['npm', 'install']

  # Paso 2: Ejecutar la construcción con la versión compatible de Node.js
  - name: 'node:20'
    args: ['npm', 'run', 'build']

options:
  logging: CLOUD_LOGGING_ONLY  # O usa REGIONAL_USER_OWNED_BUCKET si prefieres logs en un bucket

images:
  - 'gcr.io/$PROJECT_ID/mercado-gaucho'  # Si estás usando Docker
