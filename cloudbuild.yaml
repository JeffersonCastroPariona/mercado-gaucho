options:
  # Usa Google Cloud Logging para los logs (sin bucket)
  logging: CLOUD_LOGGING_ONLY
  # O usa REGIONAL_USER_OWNED_BUCKET si prefieres usar un bucket regional para logs
  # default_logs_bucket_behavior: REGIONAL_USER_OWNED_BUCKET

steps:
  - name: 'gcr.io/cloud-builders/npm'
    args: ['install']
  - name: 'gcr.io/cloud-builders/npm'
    args: ['run', 'build']

images:
  - 'gcr.io/$PROJECT_ID/my-app'
